[project.urls]
homepage = "https://github.com/humanoid-path-planner/hpp-toppra"
issues = "https://github.com/humanoid-path-planner/hpp-toppra/issues"
repository = "https://github.com/humanoid-path-planner/hpp-toppra"

[tool.tomlsort]
all = true
