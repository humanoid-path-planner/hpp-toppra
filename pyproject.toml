requires = [
  "cmeel-boost[build] ~= 1.90.0",
  "cmeel-toppra[build]",
  "cmeel[build]",
  "hpp-python[build]"
]

[project]
authors = [
  {name = "Florent Lamiraux"},
  {name = "Joseph Mirabel"},
  {name = "Paul Sardin"}
]
dependencies = [
  "cmeel-boost ~= 1.90.0",
  "cmeel-toppra",
  "hpp-python"
]
